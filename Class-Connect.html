<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Connect - Student Version</title>
</head>
<body>


<header>
<h1>Class Connect</h1>
<p>Student Collaboration Platform</p>
</header>

<div id="loginScreen">
  <h2>Login</h2>
  <input id="loginName" placeholder="Enter Your Name" /><br><br>
  <input id="loginID" placeholder="Enter Student ID" /><br><br>
  <button onclick="loginUser()">Login</button>
</div>

<div id="mainUI" style="display:none;">
  <h1>Class Connect</h1>
  <p>Welcome, <span id="studentDisplay"></span>!</p>
  <button onclick="logoutUser()">Logout</button>
  <hr>

  <a href="#" onclick="showSection('home')">Home</a> |
  <a href="#" onclick="showSection('announcements')">Announcements</a> |
  <a href="#" onclick="showSection('chat')">Chat</a>

    <div id="announcements" class="section" style="display:none;">

  <h2>Announcements</h2>
    <ul id="announcementList"></ul>
    <input id="announcementInput" placeholder="Add announcement..." />
    <button onclick="addAnnouncement()">Post</button>
  </div>

  <div id="chat" class="section" style="display:none;">
    <h2>Class Chat</h2>
    <div id="chatBox" style="border:1px solid #000; height:200px; overflow:auto;"></div>
    <input id="chatInput" placeholder="Type a message..." />
    <button onclick="sendMessage()">Send</button>
  </div>
</div>
